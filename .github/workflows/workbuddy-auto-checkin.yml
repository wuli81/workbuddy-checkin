name: WorkBuddy 自动签到

on:
  schedule:
    # UTC; 北京时间 09:07、14:07、20:07。后两次为补签机会。
    - cron: '7 1,6,12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workbuddy-auto-checkin.yml'

permissions:
  contents: read

concurrency:
  group: workbuddy-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 记录触发来源
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Trigger: $EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          date -u >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 写入凭证
        env:
          WORKBUDDY_AUTH: ${{ secrets.WORKBUDDY_AUTH }}
        run: |
          mkdir -p auths
          if [ -n "$WORKBUDDY_AUTH" ]; then
            echo "$WORKBUDDY_AUTH" > auths/workbuddy-auth.json
            echo "凭证已写入"
          else
            echo "未设置 WORKBUDDY_AUTH secret，跳过"
            exit 1
          fi

      - name: 执行签到 + Bark 通知
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python3 workbuddy_checkin.py signin

      - name: 查询积分
        run: python3 workbuddy_checkin.py credit

      - name: 清理凭证
        if: always()
        run: rm -rf auths/
